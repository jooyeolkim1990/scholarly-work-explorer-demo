name: Public staging QA (not release approval)

on:
  push:
    branches: [work/public-demo-staging-20261106]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-and-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Inspect data boundary and exercise public prototype in Chromium
        run: python tests/public_staging_qa.py
